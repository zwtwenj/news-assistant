# 生产编排：单机全量（plan §11）。部署目录 /opt/news-assistant
# 用法：见 deploy.sh（迁移 + 拉起 + 健康验证）；配置经同目录 .env 注入
name: news-assistant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: news
    ports:
      - "5432:5432" # 公网暴露（强密码），本地开发复用
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD} # healthcheck 内 $REDIS_PASSWORD 依赖此注入
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379" # 公网暴露（requirepass），本地开发复用
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/zwtwenj/news-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_data:/app/media # 播客生成中暂存（终存 OSS）
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-crawl:
    image: ghcr.io/zwtwenj/news-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks worker -Q crawl -c 4 -n crawl@%h
    depends_on:
      redis:
        condition: service_healthy

  celery-llm:
    image: ghcr.io/zwtwenj/news-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks worker -Q llm -c 2 -n llm@%h
    depends_on:
      redis:
        condition: service_healthy

  celery-media:
    image: ghcr.io/zwtwenj/news-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks worker -Q media,default -c 2 -n media@%h
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/zwtwenj/news-backend:latest
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks beat
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/zwtwenj/news-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80" # 80 已被服务器上 blog-frontend 占用
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - frontend

volumes:
  pgdata:
  media_data:
