# 入口反代：/api /media /feed /healthz → web；其余 → frontend
# upstream 用变量 + Docker 内嵌 DNS 动态解析：web/frontend 容器重建后 IP 变化
# 不再触发启动期 "host not found in upstream" 崩溃循环，也无需重启 nginx 刷新缓存
events {}

http {
  server {
    listen 80;
    # 音频复刻等上传预留（录音 ≤20MB）
    client_max_body_size 20m;

    # Docker 内嵌 DNS（127.0.0.11），10s 缓存
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
      set $web http://web:8000;
      proxy_pass $web;
    }
    location /media/ {
      set $web http://web:8000;
      proxy_pass $web;
    }
    # 公开 RSS 订阅端点（平台/阅读器抓取，直达后端，不经 Next 代理）
    location /feed/ {
      set $web http://web:8000;
      proxy_pass $web;
    }
    # 探针直连后端（compose healthcheck / 负载均衡用）
    location = /healthz {
      set $web http://web:8000;
      proxy_pass $web;
    }
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
    }
  }
}
