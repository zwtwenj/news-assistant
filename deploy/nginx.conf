# 入口反代：/api /media /healthz → web；其余 → frontend
events {}

http {
  upstream web {
    server web:8000;
  }
  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    # 音频复刻等上传预留（录音 ≤20MB）
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
      proxy_pass http://web;
    }
    location /media/ {
      proxy_pass http://web;
    }
    # 探针直连后端（compose healthcheck / 负载均衡用）
    location = /healthz {
      proxy_pass http://web;
    }
    location / {
      proxy_pass http://frontend;
    }
  }
}
